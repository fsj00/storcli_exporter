{{- if .Values.podMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "storcli-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storcli-exporter.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "storcli-exporter.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      path: {{ .Values.storcliExporter.metricsPath | quote }}
      interval: {{ .Values.podMonitor.interval }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
{{- end -}}
